name: Niooo M — Web & Android Release Build

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  build-web:
    name: Build Flutter Web
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Cache Flutter SDK
        uses: actions/cache@v4
        id: flutter-cache
        with:
          path: /opt/hostedtoolcache/flutter
          key: flutter-cache-3.29.0-v1

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.0'
          channel: 'stable'
          cache: true

      - name: Cache Pub Dependencies
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-cache-${{ runner.os }}-${{ hashFiles('**/pubspec.yaml') }}
          restore-keys: |
            pub-cache-${{ runner.os }}-

      - name: Get dependencies
        run: flutter pub get

      - name: Compile Flutter Web
        run: |
          flutter build web --release --base-href / -v
          cd build/web
          zip -q -r ../../flutter-web-bundle.zip .
          cd ../..

      - name: Upload Web Artifact
        uses: actions/upload-artifact@v4
        with:
          name: flutter-web-bundle
          path: flutter-web-bundle.zip
          retention-days: 1

  build-android-release:
    name: Build Android Release APK & Publish Single Release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Cache Flutter SDK
        uses: actions/cache@v4
        with:
          path: /opt/hostedtoolcache/flutter
          key: flutter-cache-3.29.0-v1

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.0'
          channel: 'stable'
          cache: true

      - name: Cache Pub & Gradle Dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: android-gradle-cache-${{ runner.os }}-${{ hashFiles('**/pubspec.yaml') }}
          restore-keys: |
            android-gradle-cache-${{ runner.os }}-

      - name: Ensure Android Platform Scaffold & Permissions
        run: |
          if [ ! -d "android" ]; then
            flutter create --platforms=android --org com.niooo.m --project-name flutter_live_app .
          fi
          # Ensure INTERNET permission is present in AndroidManifest.xml
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST" ] && ! grep -q "android.permission.INTERNET" "$MANIFEST"; then
            sed -i 's/<application/<uses-permission android:name="android.permission.INTERNET"\/>\n    <application/' "$MANIFEST"
          fi
          # Set app label to Niooo M
          if [ -f "$MANIFEST" ]; then
            sed -i 's/android:label="[^"]*"/android:label="Niooo M"/' "$MANIFEST"
          fi

      - name: Get dependencies
        run: flutter pub get

      - name: Build Android Release APK
        run: |
          flutter build apk --release --no-tree-shake-icons
          cp build/app/outputs/flutter-apk/app-release.apk ./Niooo-M-release.apk

      - name: Upload APK Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: niooo-m-release-apk
          path: Niooo-M-release.apk
          retention-days: 7

      - name: Publish / Replace Single GitHub Release APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="latest"
          TITLE="Niooo M — Latest Android Release APK"
          NOTES="Automated Android Release APK build for **Niooo M** (Commit: \`${GITHUB_SHA::7}\`). Every new build automatically replaces \`Niooo-M-release.apk\` in this single release without creating duplicate releases."

          # Update the 'latest' git tag to point to the current commit
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -fa "$TAG" -m "Latest Android Release APK"
          git push origin "$TAG" --force

          # If the single release already exists, upload & overwrite (--clobber) the APK file in place
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Updating existing single release '$TAG' and replacing APK..."
            gh release upload "$TAG" ./Niooo-M-release.apk --clobber
            gh release edit "$TAG" --title "$TITLE" --notes "$NOTES" --latest
          else
            echo "Creating initial single release '$TAG' with APK..."
            gh release create "$TAG" ./Niooo-M-release.apk --title "$TITLE" --notes "$NOTES" --latest
          fi
